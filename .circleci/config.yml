version: 2.1
jobs:
  install-and-test:
    docker:
      - image: cimg/node:current
    steps:
      - checkout
      - run: corepack enable --install-directory ~/bin
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
workflows:
  install-and-test:
    jobs:
      - install-and-test
